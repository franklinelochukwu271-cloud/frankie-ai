
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d24">
  <title>FRANKIE AI | Voice Assistant</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #18295c, #080d24 65%);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 30px 22px;
      border: 1px solid #344b85;
      border-radius: 28px;
      background: rgba(8, 13, 36, 0.88);
      box-shadow: 0 0 45px #2349a533;
    }

    h1 {
      color: #79aaff;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .subtitle { color: #aab8d4; }
    
/* FRANKIE AI — New Energy Core */
.orb {
  position: relative;
  width: 210px;
  height: 210px;
  margin: 30px auto;
  border-radius: 50%;
  isolation: isolate;
  overflow: visible;
  background: radial-gradient(
    circle at 50% 50%,
    #ffffff 0%,
    #8ff5ff 8%,
    #268cff 25%,
    #5528e8 48%,
    #080d24 72%
  );
  box-shadow:
    0 0 25px #37dfff,
    0 0 60px #5b42ff,
    0 0 100px #9b35ff66;
}
    .orb .orb-core {
  position: absolute;
  inset: 25%;
  border-radius: 50%;
  background: radial-gradient(
    circle at 35% 30%,
    #ffffff 0%,
    #8ff5ff 12%,
    #318bff 38%,
    #5528e8 68%,
    #080d24 100%
  );
  box-shadow:
    0 0 20px #20eaff,
    0 0 45px #6b46ff;
  animation: frankie-breathe 2s ease-in-out infinite alternate;
}
    .orb .orb-core::before {
  content: "";
  position: absolute;
  inset: -8%;
  border-radius: 50%;
  background: conic-gradient(
    transparent,
    #20eaff,
    #8b5bff,
    #ff54d8,
    transparent
  );
  filter: blur(12px);
  opacity: 0.8;
  animation: frankie-swirl 3s linear infinite;
}
    .orb::after {
  content: "";
  position: absolute;
  inset: 12%;
  border: 2px solid #8ff5ff;
  border-radius: 50%;
  box-shadow:
    0 0 18px #20eaff,
    inset 0 0 25px #6b46ff;
  animation: frankie-breathe 2s ease-in-out infinite alternate;
  pointer-events: none;
}
    
    .orb::before {
  content: "";
  position: absolute;
  inset: -12%;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    #20eaff 55deg,
    #6b46ff 110deg,
    #ff54d8 165deg,
    transparent 220deg,
    #318bff 290deg,
    transparent 360deg
  );
  filter: blur(9px);
  opacity: 0.9;
  animation: frankie-swirl 4s linear infinite;
  z-index: -1;
}

    #status { color: #9dc4ff; min-height: 24px; }

    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 20px;
      margin: 6px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      background: linear-gradient(135deg, #246bfe, #7939e8);
    }

    button:disabled { opacity: 0.55; cursor: wait; }

    #listen { border-radius: 30px; padding: 16px 28px; }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #344b85;
      background: #101b3d;
      color: white;
      font-size: 16px;
      margin-top: 16px;
    }

    #reply {
      text-align: left;
      line-height: 1.6;
      background: #101b3d;
      border-radius: 14px;
      padding: 16px;
      min-height: 65px;
      margin-top: 20px;
      overflow-wrap: anywhere;
    }

    small { color: #aab8d4; display: block; margin-top: 18px; }
    
/* FRANKIE AI — Siri-inspired energy orb */
    
@keyframes frankie-swirl {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
    @keyframes frankie-breathe {
  from {
    transform: scale(0.94);
    opacity: 0.6;
  }
  to {
    transform: scale(1.06);
    opacity: 1;
  }
}
    .energy-visual {
  width: 100%;
  max-width: 350px;
  margin: 20px auto;
  overflow: hidden;
  line-height: 0;
  border-radius: 20px;
}

.energy-visual img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 0 18px #6b46ff);
  animation: frankie-energy-motion 8s ease-in-out infinite;
}
  </style>
</head>
<body>
  <main class="app">
    <h1>FRANKIE AI</h1>
    <p class="subtitle">Your personal voice assistant</p>

    
<div class="energy-visual" aria-hidden="true">
  <img
    src="./aec0985d-6103-4792-a39e-c0ee1b0c56c4.png"
    alt=""
  >
</div>
    

    <p id="status">Your assistant is ready.</p>

    <button id="listen">🎙️ Talk to Frankie</button>

    <form id="chatForm">
      <input id="message" placeholder="Type a message..." autocomplete="off">
      <button type="submit">Send</button>
    </form>

    <div id="reply" aria-live="polite">
      Hello! I'm Frankie. Tap the microphone button or type a message to begin.
    </div>

    <button id="speakAgain">🔊 Speak Again</button>
    <button id="stopVoice">🔇 Stop Voice</button>

    <small>Starter edition · Browser voice features</small>
  </main>

  <script>
    const statusText = document.getElementById("status");
    const reply = document.getElementById("reply");
    const message = document.getElementById("message");
    const listenButton = document.getElementById("listen");

    let lastReply = "Hello! I'm Frankie. How can I help you today?";

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        statusText.textContent = "Speech output is not supported in this browser.";
        return;
      }

      window.speechSynthesis.cancel();
      lastReply = text;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-NG";
      utterance.rate = 1;
      window.speechSynthesis.speak(utterance);
    }

    function respond(text) {
      const words = text.toLowerCase().trim();
      let answer;

      if (/\b(hello|hi|hey)\b/.test(words)) {
        answer = "Hello! I'm Frankie AI, your personal assistant. What can I help you with?";
      } else if (words.includes("your name")) {
        answer = "My name is Frankie AI. Nice to meet you!";
      } else if (words.includes("time")) {
        answer = "The time on this device is " +
          new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}) + ".";
      } else if (words.includes("date")) {
        answer = "Today is " +
          new Date().toLocaleDateString([], {dateStyle: "full"}) + ".";
      } else if (words.includes("thank")) {
        answer = "You're welcome! I'm happy to help.";
      } else if (words.includes("help")) {
        answer = "You can greet me, ask my name, ask for the time or date, or type another message.";
      } else {
        answer = "I heard you say: " + text +
          ". My smart AI connection has not been added yet. We'll build that next.";
      }

      reply.textContent = answer;
      statusText.textContent = "Frankie has replied.";
      speak(answer);
    }

    document.getElementById("chatForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const text = message.value.trim();
      if (!text) return;
      respond(text);
      message.value = "";
    });

    listenButton.addEventListener("click", function() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        statusText.textContent =
          "Voice input is not supported here. Try a supported browser or type below.";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-NG";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = function() {
        statusText.textContent = "Listening... Speak now.";
        listenButton.disabled = true;
      };

      recognition.onresult = function(event) {
        const spoken = event.results[0][0].transcript;
        message.value = spoken;
        respond(spoken);
      };

      recognition.onerror = function() {
        statusText.textContent = "Couldn't hear you. Check microphone permission and try again.";
      };

      recognition.onend = function() {
        listenButton.disabled = false;
      };

      try {
        recognition.start();
      } catch (error) {
        listenButton.disabled = false;
        statusText.textContent = "Please wait a moment and try again.";
      }
    });

    document.getElementById("speakAgain").addEventListener("click", function() {
      speak(lastReply);
    });

    document.getElementById("stopVoice").addEventListener("click", function() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      statusText.textContent = "Voice stopped.";
    });
  </script>
</body>
</html>
