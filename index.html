<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050403">
<meta name="description" content="BABE AI — Your personal AI companion across every device.">
<title>BABE AI | Your AI Companion</title>
<style>
:root {
  --gold: #ffd52e;
  --bright-gold: #ffeb82;
  --amber: #ff9e00;
  --black: #050403;
  --panel: #090908;
  --text: #f6f4ee;
  --muted: #c8c6c0;
  --line: rgba(255, 197, 22, .8);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--black);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button, a {
  -webkit-tap-highlight-color: transparent;
}

.site-header {
  min-height: 76px;
  padding: 12px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  border-bottom: 1px solid rgba(255, 201, 32, .35);
  background: rgba(5, 4, 3, .97);
  position: relative;
  z-index: 5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.crown {
  color: var(--gold);
  font-size: 43px;
  line-height: 1;
  text-shadow: 0 0 18px #ffb00075;
}

.brand-name {
  color: var(--bright-gold);
  font-size: 30px;
  font-weight: 800;
  letter-spacing: .5px;
}

.brand-subtitle {
  color: #ddd4b8;
  font-size: 12px;
  margin-top: 2px;
}

.navigation {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(13px, 3vw, 40px);
  font-size: 13px;
}

.navigation a:hover {
  color: var(--gold);
}

.gold-button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  min-height: 42px;
  padding: 0 24px;
  border: 1px solid #ffe875;
  border-radius: 40px;
  color: #171000;
  background: linear-gradient(180deg, #ffe879, #ffc20d 58%, #ff9e00);
  box-shadow: 0 0 20px #ffbd1930, inset 0 1px 2px #fff7b6;
  font-size: 13px;
  font-weight: 800;
  transition: transform .2s, box-shadow .2s;
}

.gold-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 28px #ffbe3280;
}

main {
  width: 100%;
}

.intro {
  text-align: center;
  padding: 27px 18px 18px;
}

.eyebrow {
  color: #ffdf46;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 5px;
  line-height: 1.8;
}

.intro h1 {
  margin: 5px auto 10px;
  max-width: 1000px;
  font-size: clamp(25px, 3.5vw, 39px);
  line-height: 1.2;
  letter-spacing: -.7px;
}

.intro h1 span {
  color: var(--gold);
  padding: 0 10px;
}

.intro p {
  max-width: 600px;
  margin: auto;
  color: #e0ddd5;
  font-size: 14px;
  line-height: 1.65;
}

.gold-rule {
  display: inline-block;
  width: 65px;
  height: 2px;
  margin: 0 14px 4px;
  background: linear-gradient(90deg, transparent, var(--gold));
  box-shadow: 0 0 10px var(--gold);
}

.gold-rule.right {
  transform: rotate(180deg);
}

/* THE CENTRAL GOLDEN AURA PROJECT MAP */

.ecosystem {
  width: min(1180px, 96%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(250px, .76fr) minmax(0, 1fr);
  grid-template-rows: auto auto auto;
  column-gap: 12px;
  row-gap: 20px;
  align-items: center;
  position: relative;
}

.experience-card {
  min-width: 0;
  min-height: 238px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px;
  position: relative;
  border: 1px solid var(--line);
  border-radius: 22px;
  background:
    radial-gradient(ellipse at 50% 100%, #9a590d14, transparent 65%),
    linear-gradient(145deg, #100f0b, #050504 72%);
  box-shadow: 0 0 18px #ffbb1010, inset 0 0 24px #ffb70005;
}

.experience-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow: inset 0 0 16px #ffc51a06;
}

.desktop-card { grid-column: 1; grid-row: 1; }
.chat-card { grid-column: 3; grid-row: 1; }
.voice-card { grid-column: 1; grid-row: 2; }
.mobile-card { grid-column: 3; grid-row: 2; }

.device {
  flex: 0 1 53%;
  min-width: 0;
}

.monitor {
  padding: 5px;
  border: 2px solid #6b727b;
  border-radius: 7px 7px 4px 4px;
  background: linear-gradient(140deg, #263447, #070b12);
  box-shadow: 0 8px 15px #000;
}

.screen {
  min-height: 125px;
  padding: 10px 7px;
  border-radius: 3px;
  background: linear-gradient(135deg, #14243a, #07101d);
  color: #dce8ff;
  font-size: 8px;
  overflow: hidden;
}

.screen-brand {
  color: var(--gold);
  font-weight: 800;
  margin-bottom: 12px;
  font-size: 10px;
}

.screen-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: 7px 0;
  padding: 6px 5px;
  border-radius: 4px;
  background: #253852;
}

.monitor-stand {
  width: 42%;
  height: 13px;
  margin: 0 auto;
  background: linear-gradient(90deg, #545b65, #d0d1d3, #535963);
}

.monitor-base {
  width: 65%;
  height: 5px;
  margin: 0 auto;
  border-radius: 50%;
  background: linear-gradient(90deg, #404650, #c3c5c8, #404650);
}

.card-copy {
  flex: 1 1 47%;
  min-width: 0;
  position: relative;
  z-index: 1;
}

.feature-icon {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--gold);
  border-radius: 13px;
  color: var(--gold);
  font-size: 23px;
  margin-bottom: 8px;
  box-shadow: 0 0 12px #ffc92813;
}

.card-copy h2 {
  margin-bottom: 9px;
  font-size: 17px;
  line-height: 1.2;
}

.card-copy p {
  color: #dedbd4;
  font-size: 13px;
  line-height: 1.48;
  margin-bottom: 12px;
}

.card-copy .gold-button {
  min-height: 34px;
  padding: 0 16px;
  gap: 9px;
  font-size: 11px;
  white-space: nowrap;
}

/* CHAT DEVICE */

.chat-device {
  flex: 0 1 47%;
  padding: 8px;
  border: 2px solid #737c88;
  border-radius: 17px;
  background: #090e16;
  box-shadow: 0 7px 20px #000;
}

.chat-top {
  color: var(--gold);
  font-size: 9px;
  margin-bottom: 12px;
}

.bubble {
  width: fit-content;
  max-width: 100%;
  padding: 7px;
  border-radius: 9px;
  background: #263c57;
  color: #f3f6ff;
  font-size: 8px;
  line-height: 1.4;
  margin: 7px 0;
}

.bubble.user {
  margin-left: auto;
  background: #1468c8;
}

.chat-input {
  padding: 8px 5px;
  margin-top: 12px;
  border: 1px solid #52657e;
  border-radius: 12px;
  color: #acbbd1;
  font-size: 8px;
}

/* VOICE PHONE */

.voice-phone, .mobile-phone {
  flex: 0 0 94px;
  width: 94px;
  min-height: 207px;
  padding: 10px 7px;
  border: 2px solid #6d7786;
  border-radius: 21px;
  background: linear-gradient(145deg, #182333, #030509 70%);
  box-shadow: 0 7px 20px #000, inset 0 0 0 2px #151a22;
  text-align: center;
  overflow: hidden;
}

.phone-notch {
  width: 34px;
  height: 5px;
  margin: -3px auto 12px;
  border-radius: 8px;
  background: #010203;
}

.phone-brand {
  color: var(--gold);
  font-size: 9px;
  font-weight: 800;
  margin-bottom: 15px;
}

.listening {
  font-size: 10px;
  color: #e5e8ef;
  margin-bottom: 14px;
}

.voice-orb {
  width: 68px;
  height: 68px;
  margin: 0 auto 13px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: white;
  font-size: 28px;
  border: 2px solid #30d8ff;
  background: radial-gradient(circle, #172c71, #081023 70%);
  box-shadow: 0 0 12px #06caff, inset 0 0 13px #6c4cff;
}

.waveform {
  height: 24px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 2px;
}

.waveform span {
  width: 2px;
  height: 10px;
  border-radius: 3px;
  background: #28baff;
  box-shadow: 0 0 5px #27bfff;
  animation: wave .7s ease-in-out infinite alternate;
}

.waveform span:nth-child(3n) { animation-delay: -.4s; height: 19px; }
.waveform span:nth-child(2n) { animation-delay: -.2s; height: 14px; }

@keyframes wave {
  to { transform: scaleY(.35); }
}

/* MOBILE COMPANION PHONE */

.mobile-phone {
  min-height: 207px;
  text-align: left;
}

.mini-aura {
  width: 48px;
  height: 48px;
  margin: 5px auto 12px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 2px solid var(--gold);
  color: var(--gold);
  font-size: 18px;
  background: radial-gradient(circle, #a96500, #130b02 70%);
  box-shadow: 0 0 15px #ffae00;
}

.phone-menu {
  padding: 7px 4px;
  margin-top: 4px;
  border-radius: 5px;
  background: #182332;
  color: #e9e9e9;
  font-size: 8px;
}

.phone-menu span {
  color: var(--gold);
  margin-right: 4px;
}

/* CENTRAL ORB */

.aura-stage {
  grid-column: 2;
  grid-row: 1 / span 2;
  align-self: stretch;
  min-height: 465px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  isolation: isolate;
}

.aura-stage::before {
  content: "";
  position: absolute;
  inset: 15% -20%;
  background: radial-gradient(ellipse, #ffb00020, #ff9e0008 42%, transparent 70%);
  z-index: -1;
}

.aura-stage::after {
  content: "";
  position: absolute;
  bottom: 9%;
  left: 5%;
  right: 5%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #d88b0b60, transparent);
}

.aura {
  width: min(100%, 315px);
  aspect-ratio: 1;
  position: relative;
  display: grid;
  place-items: center;
}

.aura-glow {
  position: absolute;
  width: 78%;
  height: 78%;
  border-radius: 50%;
  background: #ffad00;
  filter: blur(45px);
  opacity: .23;
  animation: glow 3s ease-in-out infinite alternate;
}

.orb-shell {
  position: absolute;
  width: 73%;
  height: 73%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 20%, #fffbd6 0, #ffda53 3%, transparent 14%),
    radial-gradient(circle at 37% 25%, #ffc52c 0, #b76a04 12%, #291502 38%, #050403 67%);
  border: 2px solid #ffe66b;
  box-shadow:
    0 0 9px #fff3a5,
    0 0 24px #ffbf19,
    0 0 48px #ff9d00a8,
    inset 0 0 25px #ffc32987,
    inset -12px -15px 25px #000;
}

.orb-shell::before {
  content: "";
  position: absolute;
  width: 28%;
  height: 13%;
  top: 17%;
  left: 15%;
  transform: rotate(35deg);
  border-radius: 50%;
  background: linear-gradient(90deg, #fff, #fff6bd88, transparent);
  filter: blur(2px);
}

.orb-shell::after {
  content: "";
  position: absolute;
  inset: 10%;
  border: 1px solid #ffed9b8a;
  border-radius: 50%;
  box-shadow: inset 0 0 18px #ffc53b55;
}

.orb-content {
  position: relative;
  z-index: 2;
  text-align: center;
  text-shadow: 0 0 15px #ffbf28a8;
}

.orb-crown {
  color: #ffe37b;
  font-size: clamp(38px, 5vw, 57px);
  line-height: 1.15;
  filter: drop-shadow(0 0 7px #ffbd27);
}

.orb-content h2 {
  font-size: clamp(23px, 3vw, 34px);
  letter-spacing: 1px;
  margin: 5px 0 4px;
}

.orb-content p {
  color: #ffe68c;
  font-size: 13px;
}

.orbit {
  position: absolute;
  width: 100%;
  height: 37%;
  border: 2px solid #ffca35;
  border-radius: 50%;
  transform: rotate(-24deg);
  box-shadow: 0 0 10px #ffb900, inset 0 0 8px #ffb90050;
}

.orbit-two {
  width: 105%;
  height: 48%;
  transform: rotate(28deg);
  border-color: #ffb21a;
  opacity: .88;
}

.orbit-three {
  width: 88%;
  height: 96%;
  transform: rotate(64deg);
  border-color: #ffe46b9c;
  opacity: .72;
}

.orb-ring {
  position: absolute;
  width: 85%;
  height: 85%;
  border: 1px solid #ffdd54a6;
  border-radius: 50%;
  box-shadow: 0 0 12px #ffb0005c;
}

.orb-ring-two {
  width: 94%;
  height: 94%;
  border-color: #ffb00075;
}

.orb-ring-three {
  width: 106%;
  height: 106%;
  border-color: #ffb00035;
}

.orb-star {
  position: absolute;
  color: #fff1a0;
  font-size: 21px;
  text-shadow: 0 0 15px #ffae00;
}

.star-top { top: 0; left: 48%; }
.star-left { left: -4%; top: 48%; }
.star-right { right: -4%; top: 48%; }
.star-bottom { bottom: 0; left: 48%; }

.platform {
  position: absolute;
  width: 102%;
  height: 23%;
  left: -1%;
  bottom: -6%;
  border-radius: 50%;
  border: 3px solid #ffc32b;
  transform: perspective(160px) rotateX(55deg);
  background: radial-gradient(ellipse, #ffb20d2b, #080603 65%);
  box-shadow: 0 0 15px #ffb00065, inset 0 0 15px #ffb00055;
}

.platform::before, .platform::after {
  content: "";
  position: absolute;
  inset: 12%;
  border: 2px solid #ffcc38a1;
  border-radius: 50%;
}

.platform::after {
  inset: 25%;
  border-color: #ffb00085;
}

@keyframes glow {
  from { opacity: .16; transform: scale(.9); }
  to { opacity: .34; transform: scale(1.1); }
}

/* CONNECTING GOLD LINES */

.connector {
  position: absolute;
  height: 2px;
  width: 15%;
  top: 23%;
  background: linear-gradient(90deg, #ffc526, #fff1a0, #ffc526);
  box-shadow: 0 0 9px #ffba00;
  z-index: -1;
}

.connector.left-top { left: 27%; transform: rotate(0deg); }
.connector.right-top { right: 27%; }
.connector.left-bottom { left: 27%; top: 64%; }
.connector.right-bottom { right: 27%; top: 64%; }

.connector-dot {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff0a0;
  box-shadow: 0 0 12px 4px #ffb000a8;
  z-index: 1;
}

.dot-left-top { left: 35.7%; top: 22%; }
.dot-right-top { right: 35.7%; top: 22%; }
.dot-left-bottom { left: 35.7%; top: 63%; }
.dot-right-bottom { right: 35.7%; top: 63%; }

/* FLOATING ORB PANEL */

.floating-card {
  grid-column: 1 / 4;
  grid-row: 3;
  width: min(650px, 88%);
  min-height: 170px;
  justify-self: center;
  display: grid;
  grid-template-columns: 75px minmax(150px, 1fr) minmax(180px, 1.35fr);
  align-items: center;
  gap: 15px;
  padding: 16px 22px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: linear-gradient(140deg, #100e09, #050504);
  box-shadow: 0 0 20px #ffb00012;
  position: relative;
}

.floating-card::before {
  content: "";
  position: absolute;
  width: 2px;
  height: 25px;
  left: 50%;
  top: -26px;
  background: linear-gradient(#ffc52b, #fff1a0);
  box-shadow: 0 0 10px #ffb000;
}

.floating-icon {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  border: 2px solid #ffdb46;
  border-radius: 50%;
  color: #ffe36d;
  background: radial-gradient(circle, #a76300, #0c0700 70%);
  box-shadow: 0 0 18px #ffae00;
  font-size: 27px;
}

.floating-card h2 {
  font-size: 18px;
  margin-bottom: 8px;
}

.floating-card p {
  color: #dedbd4;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 10px;
}

.laptop {
  min-width: 0;
  align-self: end;
}

.laptop-screen {
  min-height: 102px;
  padding: 10px;
  border: 3px solid #424b57;
  border-radius: 8px 8px 3px 3px;
  background:
    radial-gradient(circle at 53% 53%, #ffac1766, transparent 35%),
    linear-gradient(150deg, #101d31, #080b13);
  display: grid;
  place-items: center;
}

.laptop-orb {
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border: 2px solid #ffd43b;
  border-radius: 50%;
  color: var(--gold);
  background: radial-gradient(circle, #ac6500, #050403 75%);
  box-shadow: 0 0 18px #ffb000;
}

.laptop-base {
  width: 110%;
  margin-left: -5%;
  height: 7px;
  border-radius: 0 0 50% 50%;
  background: linear-gradient(#9ba1aa, #343a43, #777d86);
}

/* FEATURE STRIP */

.benefits {
  width: min(1180px, 96%);
  margin: 15px auto 0;
  padding: 20px 10px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border: 1px solid #a77c1d;
  border-radius: 22px;
  background: linear-gradient(90deg, #0d0b06, #080705, #0d0b06);
  box-shadow: 0 0 23px #ffb0000b;
}

.benefit {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 0 12px;
  border-right: 1px solid #80601869;
  min-width: 0;
}

.benefit:last-child {
  border-right: 0;
}

.benefit-icon {
  flex-shrink: 0;
  color: var(--gold);
  font-size: 29px;
  line-height: 1;
}

.benefit span:last-child {
  font-size: 12px;
  line-height: 1.5;
}

/* GOLDEN FOOTER */

.footer {
  min-height: 220px;
  padding: 28px 15px 36px;
  text-align: center;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 0%, #7b490d1a, transparent 55%),
    linear-gradient(#050403, #080502);
}

.footer::before, .footer::after {
  content: "";
  position: absolute;
  width: 65%;
  height: 95px;
  bottom: -25px;
  border-top: 2px solid #ffba16;
  border-radius: 50%;
  filter: drop-shadow(0 0 6px #ffb000);
  pointer-events: none;
}

.footer::before {
  left: -12%;
  transform: rotate(-10deg);
}

.footer::after {
  right: -12%;
  transform: rotate(10deg);
}

.tagline {
  color: #ffdc59;
  font-family: Georgia, serif;
  font-size: clamp(29px, 4vw, 42px);
  font-style: italic;
  margin-bottom: 9px;
  position: relative;
  z-index: 1;
}

.footer-subtitle {
  color: #d8e2ee;
  font-size: 12px;
  letter-spacing: 1.4px;
  margin-bottom: 23px;
  position: relative;
  z-index: 1;
}

.footer .gold-button {
  min-width: 185px;
  position: relative;
  z-index: 1;
}

/* RESPONSIVE LAYOUT */

@media (min-width: 1100px) {
  .experience-card {
    min-height: 245px;
  }

  .ecosystem {
    row-gap: 25px;
  }
}

@media (max-width: 850px) {
  .site-header {
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
  }

  .navigation {
    order: 3;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
    padding: 5px 0;
  }

  .ecosystem {
    width: min(680px, 94%);
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    row-gap: 15px;
    column-gap: 12px;
  }

  .aura-stage {
    grid-column: 1 / 3;
    grid-row: 1;
    min-height: 340px;
  }

  .aura {
    width: min(270px, 75vw);
  }

  .desktop-card { grid-column: 1; grid-row: 2; }
  .chat-card { grid-column: 2; grid-row: 2; }
  .voice-card { grid-column: 1; grid-row: 3; }
  .mobile-card { grid-column: 2; grid-row: 3; }

  .experience-card {
    min-height: 240px;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: 10px;
    padding: 13px;
  }

  .device, .chat-device {
    width: 100%;
    flex-basis: auto;
    max-width: 180px;
    align-self: center;
  }

  .screen {

  </style>
 <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body>
  <main class="app">
    <h1>FRANKIE AI</h1>
    <p class="subtitle">Your personal voice assistant</p>


<div class="energy-visual" aria-hidden="true">
  <div class="frankie-orb">
    <div class="orb-halo"></div>
    
    <div class="orb-light"></div>
  </div>
</div>
  
<svg class="plasma-orb" viewBox="0 0 320 320" role="presentation">
  <defs>
    <radialGradient id="coreLight">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="12%" stop-color="#f4ffff"/>
      <stop offset="28%" stop-color="#67f0ff" stop-opacity=".95"/>
      <stop offset="52%" stop-color="#5865ff" stop-opacity=".65"/>
      <stop offset="76%" stop-color="#d044ff" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#080d24" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7ffff"/>
      <stop offset="22%" stop-color="#20eaff"/>
      <stop offset="48%" stop-color="#5265ff"/>
      <stop offset="72%" stop-color="#d044ff"/>
      <stop offset="100%" stop-color="#ff83e8"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="fineGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <clipPath id="orbBoundary">
      <circle cx="160" cy="160" r="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#orbBoundary)">
    <circle cx="160" cy="160" r="116" fill="#15265d"/>

    <g class="plasma-ribbons" fill="none" stroke-linecap="round">
      <g class="plasma-flow" stroke="url(#flowLight)" filter="url(#softGlow)" opacity=".95">
        <path d="M48 148 C80 58 164 48 221 88 S278 171 222 211 S108 252 75 188 S126 87 188 112 S225 178 174 204"
          stroke-width="25"/>
        <path d="M63 199 C36 137 91 69 148 86 S239 119 225 167 S151 238 112 207 S90 145 142 131 S204 157 190 187"
          stroke-width="20"/>
        <path d="M90 65 C151 92 243 81 255 139 S205 235 150 224 S69 164 106 127 S188 114 215 153"
          stroke-width="17"/>
      </g>

      <g stroke="url(#flowLight)" opacity=".9">
        
      </g>

      <g stroke="#d8ffff" filter="url(#fineGlow)" opacity=".8">
        
      </g>
      </g>
</svg>
</div>
    
    <p id="status">Your assistant is ready.</p>

    <button id="listen">🎙️ Talk to Frankie</button>

    <form id="chatForm">
      <input id="message" placeholder="Type a message..." autocomplete="off">
      <button type="submit">Send</button>
    </form>

    <div id="reply" aria-live="polite">
      Hello! I'm Frankie. Tap the microphone button or type a message to begin.
    </div>

    <button id="speakAgain">🔊 Speak Again</button>
    <button id="stopVoice">🔇 Stop Voice</button>

    <small>Starter edition · Browser voice features</small>
  </main>

  <script>
    const statusText = document.getElementById("status");
    const reply = document.getElementById("reply");
    const message = document.getElementById("message");
    const listenButton = document.getElementById("listen");

    let lastReply = "Hello! I'm Frankie. How can I help you today?";

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        statusText.textContent = "Speech output is not supported in this browser.";
        return;
      }

      window.speechSynthesis.cancel();
      lastReply = text;
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      utterance.voice = voices.find(v => v.lang === "en-US" && /female|samantha|aria|jenny/i.test(v.name)) || voices.find(v => v.lang === "en-US");
      utterance.lang = "en-US";
      utterance.rate = 1;
      window.speechSynthesis.speak(utterance);
    }

    
    async function respond(text) {
      const words = text.toLowerCase().trim();
      let answer;

      if (/\b(hello|hi|hey)\b/.test(words)) {
        answer = "Hello! I'm Frankie AI, your personal assistant. What can I help you with?";
      } else if (words.includes("your name")) {
        answer = "My name is Frankie AI. Nice to meet you!";
      } else if (words.includes("time")) {
        answer = "The time on this device is " +
          new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}) + ".";
      } else if (words.includes("date")) {
        answer = "Today is " +
          new Date().toLocaleDateString([], {dateStyle: "full"}) + ".";
      } else if (words.includes("thank")) {
        answer = "You're welcome! I'm happy to help.";
      } else if (words.includes("help")) {
        answer = "You can ask me questions, and I'll try to help.";
      } else {
        answer = "Let me think...";
        reply.textContent = answer;
        statusText.textContent = "Frankie is thinking...";

        try {
          const response = await fetch("https://frankie-ai.onrender.com/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "AI request failed");
          }

          answer = data.reply || "I couldn't generate a reply.";
        } catch (error) {
  console.error("FRANKIE AI error:", error);
  answer = "Connection error: " + error.message;
}
      }

      reply.innerHTML = DOMPurify.sanitize(marked.parse(answer));
      lastReply = answer;
      statusText.textContent = "Frankie has replied.";
      speak(reply.innerText);
    }

    document.getElementById("chatForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const text = message.value.trim();
      if (!text) return;
      respond(text);
      message.value = "";
    });

    listenButton.addEventListener("click", function() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        statusText.textContent =
          "Voice input is not supported here. Try a supported browser or type below.";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = function() {
        statusText.textContent = "Listening... Speak now.";
        listenButton.disabled = true;
      };

      recognition.onresult = function(event) {
        const spoken = event.results[0][0].transcript;
        message.value = spoken;
        respond(spoken);
      };

      recognition.onerror = function() {
        statusText.textContent = "Couldn't hear you. Check microphone permission and try again.";
      };

      recognition.onend = function() {
        listenButton.disabled = false;
      };

      try {
        recognition.start();
      } catch (error) {
        listenButton.disabled = false;
        statusText.textContent = "Please wait a moment and try again.";
      }
    });

    document.getElementById("speakAgain").addEventListener("click", function() {
      speak(lastReply);
    });

    document.getElementById("stopVoice").addEventListener("click", function() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      statusText.textContent = "Voice stopped.";
    });
    
  </script>
</body>
</html>
