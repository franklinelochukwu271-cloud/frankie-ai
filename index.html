
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d24">
  <title>FRANKIE AI | Voice Assistant</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #18295c, #080d24 65%);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 30px 22px;
      border: 1px solid #344b85;
      border-radius: 28px;
      background: rgba(8, 13, 36, 0.88);
      box-shadow: 0 0 45px #2349a533;
    }

    h1 {
      color: #79aaff;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .subtitle { color: #aab8d4; }
    
/* FRANKIE AI — New Energy Core */
.orb {
  position: relative;
  width: 210px;
  height: 210px;
  margin: 30px auto;
  border-radius: 50%;
  isolation: isolate;
  overflow: visible;
  background: radial-gradient(
    circle at 50% 50%,
    #ffffff 0%,
    #8ff5ff 8%,
    #268cff 25%,
    #5528e8 48%,
    #080d24 72%
  );
  box-shadow:
    0 0 25px #37dfff,
    0 0 60px #5b42ff,
    0 0 100px #9b35ff66;
}
    .orb .orb-core {
  position: absolute;
  inset: 25%;
  border-radius: 50%;
  background: radial-gradient(
    circle at 35% 30%,
    #ffffff 0%,
    #8ff5ff 12%,
    #318bff 38%,
    #5528e8 68%,
    #080d24 100%
  );
  box-shadow:
    0 0 20px #20eaff,
    0 0 45px #6b46ff;
  animation: frankie-breathe 2s ease-in-out infinite alternate;
}
    .orb .orb-core::before {
  content: "";
  position: absolute;
  inset: -8%;
  border-radius: 50%;
  background: conic-gradient(
    transparent,
    #20eaff,
    #8b5bff,
    #ff54d8,
    transparent
  );
  filter: blur(12px);
  opacity: 0.8;
  animation: frankie-swirl 3s linear infinite;
}
    .orb::after {
  content: "";
  position: absolute;
  inset: 12%;
  border: 2px solid #8ff5ff;
  border-radius: 50%;
  box-shadow:
    0 0 18px #20eaff,
    inset 0 0 25px #6b46ff;
  animation: frankie-breathe 2s ease-in-out infinite alternate;
  pointer-events: none;
}
    
    .orb::before {
  content: "";
  position: absolute;
  inset: -12%;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    #20eaff 55deg,
    #6b46ff 110deg,
    #ff54d8 165deg,
    transparent 220deg,
    #318bff 290deg,
    transparent 360deg
  );
  filter: blur(9px);
  opacity: 1;
  animation: frankie-swirl 4s linear infinite;
  z-index: -1;
}

    #status { color: #9dc4ff; min-height: 24px; }

    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 20px;
      margin: 6px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      background: linear-gradient(135deg, #246bfe, #7939e8);
    }

    button:disabled { opacity: 0.55; cursor: wait; }

    #listen { border-radius: 30px; padding: 16px 28px; }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #344b85;
      background: #101b3d;
      color: white;
      font-size: 16px;
      margin-top: 16px;
    }

    #reply {
      text-align: left;
      line-height: 1.6;
      background: #101b3d;
      border-radius: 14px;
      padding: 16px;
      min-height: 65px;
      margin-top: 20px;
      overflow-wrap: anywhere;
    }

    small { color: #aab8d4; display: block; margin-top: 18px; }
    
/* FRANKIE AI — Siri-inspired energy orb */
    
@keyframes frankie-swirl {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
    @keyframes frankie-breathe {
  from {
    transform: scale(0.94);
    opacity: 0.6;
  }
  to {
    transform: scale(1.06);
    opacity: 1;
  }
}
.energy-visual {
  position: relative;
  width: 100%;
  max-width: 360px;
  height: 360px;
  margin: 10px auto 25px;
  overflow: visible;
  background: transparent;
}
    
.plasma-orb {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.plasma-ribbons {
  transform-origin: 160px 160px;
  animation: plasma-drift 8s ease-in-out infinite;
}

.plasma-halo {
  transform-origin: 160px 160px;
  animation: plasma-glow 3s ease-in-out infinite alternate;
}

.plasma-bright-core {
  transform-origin: 160px 160px;
  animation: plasma-core-pulse 2.4s ease-in-out infinite alternate;
}
    
.plasma-orb {
  filter: drop-shadow(0 0 12px rgba(32, 234, 255, 0.35))
          drop-shadow(0 0 28px rgba(155, 66, 255, 0.3));
}

@keyframes plasma-drift {
  0% {
    transform: rotate(0deg) scale(0.98);
  }
  50% {
    transform: rotate(180deg) scale(1);
  }
  100% {
    transform: rotate(360deg) scale(0.98);
  }
}
}
@keyframes plasma-glow {
  from {
    opacity: 0.65;
    transform: scale(0.92);
  }
  to {
    opacity: 1;
    transform: scale(1.08);
  }
}

@keyframes plasma-core-pulse {
  from {
    opacity: 0.75;
    transform: scale(0.88);
  }
  to {
    opacity: 1;
    transform: scale(1.08);
  }
}

.energy-visual img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 0 18px #6b46ff);
  animation: frankie-energy-motion 8s ease-in-out infinite;
}
    @keyframes frankie-energy-motion {
  0%, 100% {
    transform: scale(1) rotate(0deg);
    filter: drop-shadow(0 0 18px #6b46ff);
  }
  50% {
    transform: scale(1.08) rotate(2deg);
    filter: drop-shadow(0 0 30px #20eaff);
  }
}
    .energy-field {
  position: absolute;
  isolation: isolate;     
  width: 260px;
  height: 260px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: background: transparent;
  filter: contrast(1.5) saturate(1.4);
  animation: energy-pulse 3s ease-in-out infinite;
}
    
.energy-field::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(
      circle at 50% 50%,
      transparent 55%,
      rgba(32, 234, 255, 0.35) 68%,
      rgba(65, 105, 255, 0.7) 74%,
      rgba(155, 66, 255, 0.4) 80%,
      transparent 88%
    );
  box-shadow:
    0 0 18px rgba(32, 234, 255, 0.35),
    0 0 40px rgba(100, 59, 255, 0.25);
  pointer-events: none;
}
    
  .energy-ribbon {
  position: absolute;
  inset: 12%;
  border: 0;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    #20eaff,
    #4169ff,
    #9b42ff,
    #ff54d8,
    #ffffff,
    #20eaff
  );
  filter: blur(9px);
  opacity: 0.78;
  mix-blend-mode: screen;
  animation: energy-flow 5s ease-in-out infinite;
}
    
@keyframes energy-flow {
  0% {
    transform: rotate(0deg) scale(0.88);
    border-radius: 42% 58% 65% 35% / 48% 38% 62% 52%;
  }
  33% {
    transform: rotate(120deg) scale(1.08);
    border-radius: 65% 35% 42% 58% / 35% 60% 40% 65%;
  }
  66% {
    transform: rotate(240deg) scale(0.96);
    border-radius: 38% 62% 55% 45% / 60% 40% 58% 42%;
  }
  100% {
    transform: rotate(360deg) scale(0.88);
    border-radius: 42% 58% 65% 35% / 48% 38% 62% 52%;
  }
}
    .ribbon-two {
  inset: 22%;
  border: 0;
  border-radius: 58% 42% 35% 65% / 42% 60% 40% 58%;
  background: conic-gradient(
    from 180deg,
    transparent 0%,
    #6335ff 18%,
    #c43cff 35%,
    #ff54d8 48%,
    transparent 65%,
    #20eaff 82%,
    transparent 100%
  );
  filter: blur(15px);
  animation: energy-flow 7s ease-in-out infinite reverse;
  opacity: 0.8;
  mix-blend-mode: screen;
}
    .ribbon-three {
  inset: 30%;
  border: 0;
  border-radius: 50%;
  background: conic-gradient(
    from 60deg,
    transparent 0%,
    #ff54d8 20%,
    #ffffff 30%,
    #20eaff 45%,
    transparent 65%,
    #8b42ff 85%,
    transparent 100%
  );
  filter: blur(10px);
  animation: energy-flow 4s linear infinite;
  opacity: 0.9;
  mix-blend-mode: screen;
}
    .ribbon-four {
  inset: -4%;
  border: 0;
  border-radius: 50%;
  background: conic-gradient(
    from 270deg,
    transparent 0%,
    #20eaff 15%,
    #643bff 30%,
    #ff54d8 45%,
    transparent 60%,
    #318bff 78%,
    transparent 100%
  );
  filter: blur(28px);
  animation: energy-flow 9s linear infinite reverse;
  opacity: 0.55;
  mix-blend-mode: screen;
}
    .energy-center {
  position: absolute;
  width: 100px;
  height: 100px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(
    circle,
    #ffffff 0%,
    #d9ffff 20%,
    #54dfff 48%,
    #7750ff 72%,
    transparent 100%
  );
  box-shadow:
  0 0 8px #ffffff,
  0 0 22px #20eaff,
  0 0 45px #7b42ff,
  0 0 75px #ff54d8;
  animation: energy-pulse 2s ease-in-out infinite alternate;
}
    @keyframes energy-pulse {
  0% {
    transform: translate(-50%, -50%) scale(0.85);
    opacity: 0.8;
  }
  100% {
    transform: translate(-50%, -50%) scale(1.15);
    opacity: 1;
  }
}
    .energy-aura {
  position: absolute;
  inset: -12%;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent 0%,
    #20eaff 15%,
    #5835ff 30%,
    #ff54d8 45%,
    transparent 60%,
    #318bff 78%,
    transparent 100%
  );
  filter: blur(22px);
  opacity: 0.75;
  mix-blend-mode: screen;
  animation: energy-flow 7s linear infinite;
}

/* FRANKIE AI — flowing multicolour screen-edge glow */
body::before {
  content: "";
  position: fixed;
  inset: -15px;
  z-index: 998;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 0% 0%,
      rgba(0, 238, 255, 0.65), transparent 35%),
    radial-gradient(ellipse at 100% 0%,
      rgba(178, 58, 255, 0.65), transparent 35%),
    radial-gradient(ellipse at 100% 100%,
      rgba(255, 55, 190, 0.55), transparent 35%),
    radial-gradient(ellipse at 0% 100%,
      rgba(38, 105, 255, 0.65), transparent 35%);
  filter: blur(28px);
  opacity: 0.85;
  animation: siriEdgeFlow 8s ease-in-out infinite alternate;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 997;
  pointer-events: none;
  background:
    linear-gradient(90deg,
      rgba(0, 238, 255, 0.16),
      transparent 22%,
      transparent 78%,
      rgba(205, 58, 255, 0.16)),
    linear-gradient(0deg,
      rgba(255, 55, 190, 0.12),
      transparent 25%,
      transparent 75%,
      rgba(0, 238, 255, 0.12));
  filter: blur(18px);
  animation: siriEdgePulse 4s ease-in-out infinite alternate;
}

@keyframes siriEdgeFlow {
  0% {
    transform: scale(0.96);
    filter: blur(32px) hue-rotate(0deg);
  }
  100% {
    transform: scale(1.04);
    filter: blur(42px) hue-rotate(35deg);
  }
}

@keyframes siriEdgePulse {
  from { opacity: 0.45; }
  to { opacity: 1; }
}
  </style>
</head>
<body>
  <main class="app">
    <h1>FRANKIE AI</h1>
    <p class="subtitle">Your personal voice assistant</p>

    

<div class="energy-visual" aria-hidden="true">
  
<svg class="plasma-orb" viewBox="0 0 320 320" role="presentation">
  <defs>
    <radialGradient id="coreLight">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="12%" stop-color="#f4ffff"/>
      <stop offset="28%" stop-color="#67f0ff" stop-opacity=".95"/>
      <stop offset="52%" stop-color="#5865ff" stop-opacity=".65"/>
      <stop offset="76%" stop-color="#d044ff" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#080d24" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7ffff"/>
      <stop offset="22%" stop-color="#20eaff"/>
      <stop offset="48%" stop-color="#5265ff"/>
      <stop offset="72%" stop-color="#d044ff"/>
      <stop offset="100%" stop-color="#ff83e8"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="fineGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <clipPath id="orbBoundary">
      <circle cx="160" cy="160" r="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#orbBoundary)">
    <circle cx="160" cy="160" r="116" fill="#15265d"/>

    <circle cx="160" cy="160" r="110" fill="url(#coreLight)"/>

    <g class="plasma-ribbons" fill="none" stroke-linecap="round">
      <g stroke="url(#flowLight)" filter="url(#softGlow)" opacity=".95">
        <path d="M48 148 C80 58 164 48 221 88 S278 171 222 211 S108 252 75 188 S126 87 188 112 S225 178 174 204"
          stroke-width="25"/>
        <path d="M63 199 C36 137 91 69 148 86 S239 119 225 167 S151 238 112 207 S90 145 142 131 S204 157 190 187"
          stroke-width="20"/>
        <path d="M90 65 C151 92 243 81 255 139 S205 235 150 224 S69 164 106 127 S188 114 215 153"
          stroke-width="17"/>
      </g>

      <g stroke="url(#flowLight)" opacity=".9">
        <path d="M48 148 C80 58 164 48 221 88 S278 171 222 211 S108 252 75 188 S126 87 188 112 S225 178 174 204"
          stroke-width="7"/>
        <path d="M63 199 C36 137 91 69 148 86 S239 119 225 167 S151 238 112 207 S90 145 142 131 S204 157 190 187"
          stroke-width="5"/>
        <path d="M90 65 C151 92 243 81 255 139 S205 235 150 224 S69 164 106 127 S188 114 215 153"
          stroke-width="4"/>
      </g>

      <g stroke="#d8ffff" filter="url(#fineGlow)" opacity=".8">
        <path d="M59 157 C91 90 137 73 186 97 S248 151 204 196 S122 224 92 179 S128 115 168 132"
          stroke-width="3"/>
        <path d="M83 209 C108 159 128 105 184 117 S229 174 188 199 S122 197 127 164 S177 145 194 167"
          stroke-width="2.5"/>
      </g>
    </g>

    <circle cx="160" cy="160" r="74" fill="url(#coreLight)"/>
    <circle cx="160" cy="160" r="28" fill="url(#coreLight)"/>
    <circle cx="160" cy="160" r="7" fill="#ffffff" opacity=".95"/>
  </g>
</svg>
</div>
    
    <p id="status">Your assistant is ready.</p>

    <button id="listen">🎙️ Talk to Frankie</button>

    <form id="chatForm">
      <input id="message" placeholder="Type a message..." autocomplete="off">
      <button type="submit">Send</button>
    </form>

    <div id="reply" aria-live="polite">
      Hello! I'm Frankie. Tap the microphone button or type a message to begin.
    </div>

    <button id="speakAgain">🔊 Speak Again</button>
    <button id="stopVoice">🔇 Stop Voice</button>

    <small>Starter edition · Browser voice features</small>
  </main>

  <script>
    const statusText = document.getElementById("status");
    const reply = document.getElementById("reply");
    const message = document.getElementById("message");
    const listenButton = document.getElementById("listen");

    let lastReply = "Hello! I'm Frankie. How can I help you today?";

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        statusText.textContent = "Speech output is not supported in this browser.";
        return;
      }

      window.speechSynthesis.cancel();
      lastReply = text;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-NG";
      utterance.rate = 1;
      window.speechSynthesis.speak(utterance);
    }

    function respond(text) {
      const words = text.toLowerCase().trim();
      let answer;

      if (/\b(hello|hi|hey)\b/.test(words)) {
        answer = "Hello! I'm Frankie AI, your personal assistant. What can I help you with?";
      } else if (words.includes("your name")) {
        answer = "My name is Frankie AI. Nice to meet you!";
      } else if (words.includes("time")) {
        answer = "The time on this device is " +
          new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}) + ".";
      } else if (words.includes("date")) {
        answer = "Today is " +
          new Date().toLocaleDateString([], {dateStyle: "full"}) + ".";
      } else if (words.includes("thank")) {
        answer = "You're welcome! I'm happy to help.";
      } else if (words.includes("help")) {
        answer = "You can greet me, ask my name, ask for the time or date, or type another message.";
      } else {
        answer = "I heard you say: " + text +
          ". My smart AI connection has not been added yet. We'll build that next.";
      }

      reply.textContent = answer;
      statusText.textContent = "Frankie has replied.";
      speak(answer);
    }

    document.getElementById("chatForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const text = message.value.trim();
      if (!text) return;
      respond(text);
      message.value = "";
    });

    listenButton.addEventListener("click", function() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        statusText.textContent =
          "Voice input is not supported here. Try a supported browser or type below.";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-NG";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = function() {
        statusText.textContent = "Listening... Speak now.";
        listenButton.disabled = true;
      };

      recognition.onresult = function(event) {
        const spoken = event.results[0][0].transcript;
        message.value = spoken;
        respond(spoken);
      };

      recognition.onerror = function() {
        statusText.textContent = "Couldn't hear you. Check microphone permission and try again.";
      };

      recognition.onend = function() {
        listenButton.disabled = false;
      };

      try {
        recognition.start();
      } catch (error) {
        listenButton.disabled = false;
        statusText.textContent = "Please wait a moment and try again.";
      }
    });

    document.getElementById("speakAgain").addEventListener("click", function() {
      speak(lastReply);
    });

    document.getElementById("stopVoice").addEventListener("click", function() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      statusText.textContent = "Voice stopped.";
    });
  </script>
</body>
</html>
